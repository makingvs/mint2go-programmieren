<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Teaser</title>
<style>
  @font-face { font-family: 'Jost'; src: url('../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  :root { --green:#98c227; --orange:#f0a030; --pink:#e01070; --blue:#38b8e8; --navy:#3757a9; --ink:#2f3a5f; --line:#e3e8f1; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Jost', sans-serif; color: var(--ink); }
  body { position: relative; background: linear-gradient(135deg, #ffffff 0%, #f3f8fd 60%, #eaf5fc 100%); }
  .gears { position: absolute; }
  .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; display: flex; align-items: center; padding: 0 34px; }
  .cd .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--green); }
  .cd .o { height: 6px; flex: 1; background: var(--orange); }
  .cd .p { height: 6px; flex: 1; background: var(--pink); border-radius: 0 3px 3px 0; }
  .cd .ring { width: 18px; height: 18px; border-radius: 50%; border: 5px solid var(--orange); margin-left: -1px; }

  .left { position: absolute; left: 64px; top: 46px; width: 560px; }
  .logo { height: 96px; display: block; mix-blend-mode: multiply; }
  h1 { margin-top: 26px; font-size: 76px; line-height: 0.98; font-weight: 800; color: var(--navy); letter-spacing: -1px; }
  h1 span { color: var(--pink); }
  .sub { margin-top: 22px; font-size: 32px; line-height: 1.22; font-weight: 500; color: var(--ink); }
  .pills { margin-top: 34px; display: flex; flex-wrap: nowrap; gap: 10px; }
  .pill { height: 46px; padding: 0 17px; border-radius: 23px; color: #fff; font-size: 21px; white-space: nowrap; font-weight: 700; display: flex; align-items: center; }

  .ipad { position: absolute; left: 648px; top: 64px; width: 510px; height: 410px; border-radius: 34px; background: #2f3a5f; padding: 14px; box-shadow: 0 30px 60px rgba(55, 87, 169, 0.28); transform: rotate(2.2deg); }
  .screen { width: 100%; height: 100%; border-radius: 22px; background: #fff; overflow: hidden; position: relative; }
  .floor { position: absolute; right: 10px; top: 12px; width: 300px; height: 200px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 3px var(--line) inset; }
  .floor svg { width: 100%; height: 100%; display: block; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--blue); }

  .blocks { position: absolute; left: 14px; top: 22px; width: 150px; display: flex; flex-direction: column; gap: 8px; }
  .hat { height: 40px; width: 70px; border-radius: 20px 20px 20px 6px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; }
  .hat svg { width: 26px; height: 26px; }
  .box { border-radius: 16px; border: 4px solid var(--green); background: #f7fbe9; padding: 6px 6px 8px 6px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .ico svg { width: 22px; height: 22px; }
  .chip { height: 32px; min-width: 38px; padding: 0 8px; border-radius: 10px; background: color-mix(in srgb, var(--c) 16%, #fff); color: var(--ink); font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .blk { border-radius: 14px; border: 3px solid var(--c); background: #fff; padding: 4px; display: flex; align-items: center; gap: 6px; }

  .reqs { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 10px; }
  .req { position: relative; width: 52px; height: 52px; border-radius: 15px; background: #eef7d3; box-shadow: 0 0 0 4px var(--green) inset; color: #7aa01a; display: flex; align-items: center; justify-content: center; }
  .req svg { width: 30px; height: 30px; }
  .req .tick { position: absolute; right: -7px; top: -7px; width: 24px; height: 24px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
  .req .tick svg { width: 15px; height: 15px; color: #fff; }
  .done { position: absolute; right: 16px; bottom: 80px; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 10px; border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(47, 58, 95, .22); transform: rotate(-3deg); }
  .done svg { width: 38px; height: 38px; color: var(--orange); fill: rgba(240, 160, 48, .3); }
  .done b { font-size: 28px; color: var(--navy); }
  .confetti span { position: absolute; width: 14px; height: 22px; border-radius: 3px; }
</style>
</head>
<body>
<svg class="gears" id="gears" style="left:-60px; top:410px; width:300px; opacity:.16" viewBox="0 0 200 160"></svg>
<svg class="gears" id="gears2" style="right:-70px; top:-50px; width:300px; opacity:.14; transform: rotate(180deg)" viewBox="0 0 200 160"></svg>

<div class="left">
  <img class="logo" src="../public/mint2go-logo.png" alt="">
  <h1>Programmieren<br><span>lernen</span></h1>
  <p class="sub">Mit Blöcken einen Roboter steuern, für Kinder von 6 bis 10 Jahren.</p>
  <div class="pills">
    <div class="pill" style="background:var(--green)">15 Aufgaben</div>
    <div class="pill" style="background:var(--blue)">4 Lektionen</div>
    <div class="pill" style="background:var(--orange)">Offline auf dem iPad</div>
  </div>
</div>

<div class="ipad"><div class="screen">
  <div class="bar"></div>
  <div class="blocks" id="blocks"></div>
  <div class="floor" id="floor"></div>
  <div class="done" id="done"></div>
  <div class="reqs" id="reqs"></div>
</div></div>

<div class="cd"><span class="dot"></span><span class="o"></span><span class="p"></span><span class="ring"></span></div>
<div class="confetti" id="confetti"></div>

<script>
const svgI = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const I = {
  start: svgI('<path d="M5 21V4"/><path d="M5 4h12l-2.5 4 2.5 4H5"/>'),
  forward: svgI('<path d="M12 20V5M6 11l6-6 6 6"/>'),
  turnLeft: svgI('<path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 6 6v5"/>'),
  turnRight: svgI('<path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0-6 6v5"/>'),
  repeat: svgI('<path d="M17 2l3 3-3 3"/><path d="M20 5H9a5 5 0 0 0-5 5v1"/><path d="M7 22l-3-3 3-3"/><path d="M4 19h11a5 5 0 0 0 5-5v-1"/>'),
  star: svgI('<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.8 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>'),
  goal: svgI('<path d="M6 21V3"/><path d="M6 4h12l-3 4.5 3 4.5H6"/>'),
  stack: svgI('<rect x="3" y="3" width="11" height="6" rx="1.5"/><rect x="7" y="9" width="11" height="6" rx="1.5"/><rect x="10" y="15" width="11" height="6" rx="1.5"/>'),
  check: svgI('<path d="m4 12 6 6L20 6"/>'),
};
function gearPath(cx, cy, r, teeth = 10, hole = 0.34) {
  const pitch = (Math.PI * 2) / teeth, root = r * 0.78; let d = '';
  for (let i = 0; i < teeth; i++) { const a = i * pitch;
    for (const [ang, rad] of [[a - pitch * .34, root], [a - pitch * .2, r], [a + pitch * .2, r], [a + pitch * .34, root]])
      d += `${d ? 'L' : 'M'}${(cx + Math.cos(ang) * rad).toFixed(2)} ${(cy + Math.sin(ang) * rad).toFixed(2)}`; }
  const h = r * hole;
  return `${d}ZM${(cx + h).toFixed(2)} ${cy}A${h.toFixed(2)} ${h.toFixed(2)} 0 1 0 ${(cx - h).toFixed(2)} ${cy}A${h.toFixed(2)} ${h.toFixed(2)} 0 1 0 ${(cx + h).toFixed(2)} ${cy}Z`;
}
const gearSvg = `<path d="${gearPath(62, 100, 52, 12, .3)}" fill="#38b8e8" fill-rule="evenodd"/><path d="${gearPath(132, 58, 40, 10, .34)}" fill="#f0a030" fill-rule="evenodd"/><circle cx="150" cy="118" r="30" fill="#e01070"/><circle cx="150" cy="118" r="11" fill="#fff"/>`;
gears.innerHTML = gearSvg; gears2.innerHTML = gearSvg;

// Blöcke: Treppe = Wiederholen 4x (vor, rechts, vor, links)
const blk = (type, color, icon, label) => `<div class="blk" style="--c:${color}"><span class="ico" style="--c:${color}">${I[icon]}</span><span class="chip" style="--c:${color}">${label}</span></div>`;
blocks.innerHTML = `
  <div class="hat">${I.start}</div>
  <div class="box">
    <div class="row"><span class="ico" style="--c:#98c227">${I.repeat}</span><span class="chip" style="--c:#98c227">4×</span></div>
    ${blk('f', '#38b8e8', 'forward', '1')}
    ${blk('r', '#38b8e8', 'turnRight', '90°')}
    ${blk('f', '#38b8e8', 'forward', '1')}
    ${blk('l', '#38b8e8', 'turnLeft', '90°')}
  </div>`;

// Boden 12 x 8 (Aufgabe "Treppe")
const W = 12, H = 8;
let grid = ''; for (let x = 1; x < W; x++) grid += `M${x} 0V${H}`; for (let y = 1; y < H; y++) grid += `M0 ${y}H${W}`;
const star = (cx, cy, r) => Array.from({ length: 10 }, (_, i) => { const a = Math.PI / 5 * i - Math.PI / 2, rad = i % 2 ? r * .45 : r; return `${(cx + Math.cos(a) * rad).toFixed(2)},${(cy + Math.sin(a) * rad).toFixed(2)}`; }).join(' ');
const trail = '1.5,6.5 1.5,5.5 2.5,5.5 2.5,4.5 3.5,4.5 3.5,3.5 4.5,3.5 4.5,2.5 5.5,2.5';
const obs = [[8,2],[8,3],[8,4],[9,4],[10,4]].map(([x, y]) => `<rect x="${x + .04}" y="${y + .04}" width=".92" height=".92" rx=".14" fill="#4d597c"/><path d="M${x + .2} ${y + .36}H${x + .8}M${x + .2} ${y + .64}H${x + .8}M${x + .5} ${y + .36}V${y + .64}" stroke="#6b7899" stroke-width=".06" stroke-linecap="round"/>`).join('');
const stars = [[2,5],[3,4],[4,3],[9,6],[10,1]].map(([x, y]) => `<polygon points="${star(x + .5, y + .52, .38)}" fill="#f0a030" stroke="#d98a12" stroke-width=".05" stroke-linejoin="round"/>`).join('');
floor.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
  <rect width="${W}" height="${H}" fill="#fbfcfe"/><path d="${grid}" stroke="#e3e8f1" stroke-width=".04" fill="none"/>
  <circle cx="1.5" cy="6.5" r=".5" fill="#98c227" opacity=".25"/>
  <rect x="5.05" y="2.05" width=".9" height=".9" rx=".14" fill="#eef7d0" stroke="#98c227" stroke-width=".07" stroke-dasharray=".18 .12"/>
  <path d="M5.32 2.84V2.16" stroke="#4d597c" stroke-width=".08" stroke-linecap="round"/><path d="M5.32 2.18L5.82 2.36L5.32 2.54Z" fill="#e01070"/>
  ${obs}
  ${stars.replace(/<polygon points="[^"]*" fill="#f0a030"/g, (m) => m)}
  <polyline points="${trail}" fill="none" stroke="#f0a030" stroke-width=".11" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <g transform="translate(5.5 2.5) rotate(90)">
    <rect x="-.47" y="-.33" width=".15" height=".52" rx=".05" fill="#2f3a5f"/><rect x=".32" y="-.33" width=".15" height=".52" rx=".05" fill="#2f3a5f"/>
    <rect x="-.34" y="-.45" width=".68" height=".9" rx=".12" fill="#fff" stroke="#3757a9" stroke-width=".06"/><path d="M-.13 -.45L0 -.63L.13 -.45Z" fill="#f0a030"/>
    <rect x="-.3" y="-.36" width=".6" height=".6" rx=".05" fill="#2f3a5f"/>
    ${[[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2],[2,3]].map(([x, y]) => `<rect x="${(x - 2.5) * .12}" y="${(y - 2.5) * .12 - .04}" width=".1" height=".1" rx=".02" fill="#ffd23f"/>`).join('')}
  </g>
</svg>`;

done.innerHTML = `${I.star}<b>Geschafft!</b>`;
reqs.innerHTML = [['goal'], ['star'], ['stack']].map(([k]) => `<div class="req">${I[k]}<span class="tick">${I.check}</span></div>`).join('');

// Konfetti
const cols = ['#98c227', '#f0a030', '#e01070', '#38b8e8', '#3757a9'];
const pos = [[690,40,20],[760,16,-30],[850,52,40],[930,20,10],[1010,8,-20],[1090,36,35],[1140,120,-45],[720,500,25],[1060,560,-15],[1130,470,50],[640,300,-35],[1170,300,15]];
confetti.innerHTML = pos.map(([x, y, r], i) => `<span style="left:${x}px;top:${y}px;background:${cols[i % 5]};transform:rotate(${r}deg)"></span>`).join('');
</script>
</body>
</html>
